stages:
  preprocess:
    cmd: python preprocess.py
    deps:
      - data
      - preprocess.py
    outs:
      - features/all_features.csv
    metrics:
      - reports/data_stats.json:
          cache: false
  train:
    cmd: python train.py
    deps:
      - features/all_features.csv
      - train.py
      - service/predict.py
    params:
      - train
    outs:
      - models
    metrics:
      - reports/metrics.json:
          cache: false
