services:
  app:
    build: .
    image: flat-price-service
    environment:
      APP_TOKEN: ${APP_TOKEN:-change_me}
      MODEL_NAME: ${MODEL_NAME:-ridge}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:1.5b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual}
    volumes:
      - ./models:/app/models:ro
      - ./features:/app/features:ro
    ports:
      - "${APP_PORT:-5000}:5000"

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - ollama pull ${CHAT_MODEL:-qwen2.5:1.5b} && ollama pull ${EMBEDDING_MODEL:-paraphrase-multilingual}
    depends_on:
      - ollama
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flat_price.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  ollama:
