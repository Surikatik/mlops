groups:
  - name: flat-price-service
    rules:
      - alert: ServiceDown
        expr: up{job="flat-price-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Сервис прогнозирования цен недоступен

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(flat_request_duration_seconds_bucket{endpoint="/api/numbers"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: p95 времени ответа API выше 500 мс

      - alert: HighErrorRate
        expr: sum(rate(flat_requests_total{status=~"5.."}[5m])) / sum(rate(flat_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Доля ответов 5xx выше 5%

      - alert: FeatureDrift
        expr: flat_feature_psi > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Дрифт признака {{ $labels.feature }}: PSI = {{ $value | printf \"%.2f\" }}"
